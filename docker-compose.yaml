# ============================================
# Binance Futures Trading Bot — Docker Compose
# ============================================

version: "3.8"

services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: binance-trading-bot
    restart: always
    env_file:
      - .env
    volumes:
      # Persist position state across container restarts
      - bot-state:/app/data/state
      # Persist logs
      - bot-logs:/app/data/logs
      # Mount .env for live config changes
      - ./.env:/app/.env:ro
    environment:
      - TZ=America/Sao_Paulo
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - bot-network

volumes:
  bot-state:
    driver: local
  bot-logs:
    driver: local

networks:
  bot-network:
    driver: bridge
